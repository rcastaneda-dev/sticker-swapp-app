apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sticker-swap-api
  labels:
    app: sticker-swap
  annotations:
    run.googleapis.com/description: "Sticker Swapp trading engine — Go backend"
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/sessionAffinity: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      serviceAccountName: sticker-swap-api@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/sticker-swap/go-service:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          env:
            - name: PORT
              value: "8080"
            - name: ABLY_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: ABLY_API_KEY
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUPABASE_SERVICE_ROLE_KEY
            - name: SUPABASE_DB_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SUPABASE_DB_URL
            - name: GOOGLE_CLOUD_PROJECT_NUMBER
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: GOOGLE_CLOUD_PROJECT_NUMBER
            - name: APPLE_APP_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: APPLE_APP_ID
